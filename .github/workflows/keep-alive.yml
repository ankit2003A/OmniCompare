# Keeps the free Render backend awake (it sleeps after ~15 min without traffic).
# Pings /health every 10 minutes. Free for public repositories.
# Note: GitHub pauses scheduled workflows after 60 days with no commits — re-enable under the Actions tab if that happens.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://omnicompare-api.onrender.com/health) && echo "HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Backend did not answer 200" && exit 1
      - name: Ping website
        run: curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 30 https://omni-compare.vercel.app/ || true
